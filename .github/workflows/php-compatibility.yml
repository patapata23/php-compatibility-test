name: PHP Compatibility Check

on:
  pull_request:
    branches: [ stable ]
    types: [opened, synchronize, reopened]
    paths:
      - '**.php'
      - '!**.blade.php'

permissions:
  contents: read
  pull-requests: write

jobs:
  php-compatibility-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP_CodeSniffer and PHPCompatibility
        run: |
          composer global require squizlabs/php_codesniffer
          composer global require phpcompatibility/php-compatibility
          # PHPCompatibilityをCodeSnifferに登録
          ~/.composer/vendor/bin/phpcs --config-set installed_paths ~/.composer/vendor/phpcompatibility/php-compatibility

      - name: Get changed PHP files
        id: changed-files
        run: |
          changed_files=$(git diff --name-only origin/stable..HEAD | grep '\.php$' || true)
          if [ -z "$changed_files" ]; then
            echo "No PHP files changed in this PR"
            echo "has_php_files=false" >> $GITHUB_OUTPUT
          else
            echo "Changed PHP files:"
            echo "$changed_files"
            echo "$changed_files" > changed_files.txt
            echo "has_php_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Check PHP 7.3-8.4 compatibility
        if: steps.changed-files.outputs.has_php_files == 'true'
        run: |
          echo "Checking PHP 7.3-8.4 compatibility for changed files..."
          # 変更されたファイルのみをチェック
          compatibility_passed=true

          # PHPCompatibility check
          echo "=== Running PHPCompatibility check ==="
          if ! ~/.composer/vendor/bin/phpcs \
            --standard=PHPCompatibility \
            --runtime-set testVersion 7.3-8.4 \
            --report=full \
            --file-list=changed_files.txt; then
            echo "::error::PHPCompatibility issues found"
            compatibility_passed=false
          fi

          # PHP syntax check with different versions
          echo "=== Running PHP syntax validation ==="
          while IFS= read -r file; do
            echo "Checking syntax for: $file"

            # PHP 7.3 syntax check
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error::Syntax error in $file"
              compatibility_passed=false
            fi

            # Static analysis for common issues
            if grep -n "::.*(" "$file" | grep -v "self::" | grep -v "parent::" | grep -v "static::" | grep -v "class::" > /dev/null; then
              echo "=== Potential static method calls found in $file ==="
              grep -n "::.*(" "$file" | grep -v "self::" | grep -v "parent::" | grep -v "static::" | grep -v "class::"
              echo "::warning::Potential static method calls detected. Please verify these are correct."
            fi
          done < changed_files.txt

          if [ "$compatibility_passed" = false ]; then
            echo "::error::Compatibility issues found. Check the report above for details."
            exit 1
          else
            echo "✅ All changed files are compatible with PHP 7.3-8.4"
          fi

      - name: Comment PR on compatibility issues
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **PHP Compatibility Issues Detected**\n\nThe changed files in this PR have compatibility issues between PHP 7.3 and 8.4.\n\nPlease check the GitHub Actions workflow logs for detailed information and fix the compatibility issues before merging to the stable branch.'
            })

      - name: Comment PR on success
        if: success() && steps.changed-files.outputs.has_php_files == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **PHP Compatibility Check Passed**\n\nAll changed files are compatible with PHP 7.3-8.4. No compatibility issues detected.'
            })

      - name: Comment PR when no PHP files changed
        if: success() && steps.changed-files.outputs.has_php_files == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'ℹ️ **PHP Compatibility Check Skipped**\n\nNo PHP files were changed in this PR.'
            })