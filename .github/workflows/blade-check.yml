name: Blade Syntax Check

on:
  pull_request:
    branches: [ stable ]
    types: [opened, synchronize, reopened]
    paths:
      - '**.blade.php'

permissions:
  contents: read
  pull-requests: write

jobs:
  blade-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'  # Laravel 4用

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Get changed Blade files
        id: changed-files
        run: |
          changed_files=$(git diff --name-only origin/stable..HEAD | grep '\.blade\.php$' | while read file; do [ -f "$file" ] && echo "$file"; done || true)
          if [ -z "$changed_files" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "$changed_files" > changed_blade_files.txt
            echo "has_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Check Blade syntax with Laravel bootstrap
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          cat > check_blade.php << 'EOPHP'
          <?php
          // Laravel 4のブートストラップ
          require __DIR__ . '/bootstrap/autoload.php';
          $app = require_once __DIR__ . '/bootstrap/start.php';
          
          $errors = [];
          $files = file('changed_blade_files.txt', FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
          
          foreach ($files as $file) {
              if (!file_exists($file)) continue;
              
              echo "Checking: $file\n";
              
              try {
                  // Laravel 4のBladeコンパイラを取得
                  $blade = $app['view']->getEngineResolver()->resolve('blade')->getCompiler();
                  
                  $content = file_get_contents($file);
                  $compiled = $blade->compileString($content);
                  
                  // PHP構文チェック
                  $tempFile = tempnam(sys_get_temp_dir(), 'blade_');
                  file_put_contents($tempFile, "<?php\n" . $compiled);
                  
                  exec("php -l " . escapeshellarg($tempFile) . " 2>&1", $output, $returnCode);
                  unlink($tempFile);
                  
                  if ($returnCode !== 0) {
                      $errors[] = [
                          'file' => $file,
                          'error' => implode("\n", $output)
                      ];
                  }
                  
              } catch (Exception $e) {
                  $errors[] = [
                      'file' => $file,
                      'error' => $e->getMessage()
                  ];
              }
          }
          
          if (!empty($errors)) {
              foreach ($errors as $error) {
                  echo "❌ {$error['file']}: {$error['error']}\n";
              }
              exit(1);
          }
          
          echo "✅ All Blade files OK\n";
          EOPHP
          
          php check_blade.php

      - name: Comment on PR
        if: always() && steps.changed-files.outputs.has_files == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const body = success 
              ? '✅ **Blade Syntax Check Passed**\n\nAll changed Blade files are syntactically correct.'
              : '⚠️ **Blade Syntax Errors Detected**\n\nPlease check the workflow logs for details.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })